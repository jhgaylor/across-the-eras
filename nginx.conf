# Runs inside the image alongside the MCP node process (see entrypoint.sh). nginx owns :8080; node owns :8081.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # MCP (Streamable HTTP, may stream SSE) → node sidecar process.
    location /mcp {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /shows/ { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location /docs/ { add_header Cache-Control "public, max-age=300"; try_files $uri $uri/ /docs/index.html; }
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=300"; }
    # /<slug>/ is client-routed: fall back to the shell.
    location / { try_files $uri $uri/ /index.html; }
}
