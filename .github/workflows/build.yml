# Builds the across-the-eras image, pushes it to ghcr.io/jhgaylor/across-the-eras,
# then pins the immutable sha tag into k8s/deployment.yaml so Flux (home-cloud)
# rolls the exact image that was just built. Multi-arch because home-cloud's
# k3s nodes are arm64 Lima VMs.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "README.md"

concurrency:
  group: build-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/across-the-eras

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check shows/index.json is current
        run: python3 scripts/build-index.py && git diff --exit-code -- shows/index.json
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pin image tag in k8s/deployment.yaml
        run: |
          sed -i -E "s#(image: ${IMAGE}:)sha-[0-9a-f]+#\1sha-${GITHUB_SHA}#" k8s/deployment.yaml
          git diff --quiet && { echo "already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: pin image sha-${GITHUB_SHA::7}"
          git push
