apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-eras-domain
  namespace: across-the-eras
  labels:
    app: across-the-eras
spec:
  redirectRegex:
    regex: "^https?://eras\\.inevitable\\.fyi/(.*)"
    replacement: "https://skipto.tv/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: across-the-eras
  namespace: across-the-eras
  labels:
    app: across-the-eras
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`skipto.tv`)"
      kind: Rule
      services:
        - name: across-the-eras
          port: 80
  tls:
    secretName: skipto-tv-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: across-the-eras-http
  namespace: across-the-eras
  labels:
    app: across-the-eras
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`skipto.tv`)"
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: default
      services:
        - name: across-the-eras
          port: 80
---
# Keep the old hostname alive as a permanent, path-preserving redirect so
# bookmarks, search results and MCP endpoints move to the canonical domain.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: across-the-eras-legacy-domain
  namespace: across-the-eras
  labels:
    app: across-the-eras
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`eras.inevitable.fyi`)"
      kind: Rule
      middlewares:
        - name: redirect-eras-domain
      services:
        - name: across-the-eras
          port: 80
  tls:
    secretName: across-the-eras-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: across-the-eras-legacy-domain-http
  namespace: across-the-eras
  labels:
    app: across-the-eras
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`eras.inevitable.fyi`)"
      kind: Rule
      middlewares:
        - name: redirect-eras-domain
      services:
        - name: across-the-eras
          port: 80
