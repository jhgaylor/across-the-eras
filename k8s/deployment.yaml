apiVersion: apps/v1
kind: Deployment
metadata:
  name: across-the-eras
  namespace: across-the-eras
  annotations:
    # Restart when the Infisical operator materializes or rotates GitHub App credentials.
    secrets.infisical.com/auto-reload: "true"
  labels:
    app: across-the-eras
spec:
  replicas: 2
  selector:
    matchLabels:
      app: across-the-eras
  template:
    metadata:
      labels:
        app: across-the-eras
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml on
          # every push to main; Flux picks up the manifest change and rolls.
          image: ghcr.io/jhgaylor/across-the-eras:sha-c599f9e79c6c4e32017cef60bb35ded894fa523b
          envFrom:
            # Optional keeps the existing read tools available during first reconcile;
            # the auto-reload annotation restarts the pods when Infisical creates it.
            - secretRef:
                name: across-the-eras-github
                optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
